services:
  - type: web
    name: loudbot-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DASHBOARD_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "40"
